# DEEPoS boot entry, read by U-Boot's distro boot (extlinux).
# KERNEL is the uncompressed arm64 Image; the DTB comes from our board DTS.
# Root is a read-only squashfs; /DATA is mounted over it for writes.
LABEL DEEPoS
    LINUX /KERNEL
    FDT /dtbs/rk3326-r36s-v20.dtb
    APPEND root=PARTLABEL=DEEPOS_A rootfstype=squashfs ro rootwait rootdelay=3 \
           console=ttyS2,1500000n8 console=tty0 loglevel=3 quiet splash \
           vt.global_cursor_default=0 consoleblank=0 nowatchdog mitigations=off \
           zswap.enabled=1 psi=1 loop.max_loop=8 init=/sbin/init
