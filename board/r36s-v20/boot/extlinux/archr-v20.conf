# DEEPoS boot entry, read by U-Boot's distro boot (extlinux).
# Arch-R embeds an initramfs. An absent rdinit lets Linux mount the DeepOS root.
# The supplementary archive provides /root for the kernel's mount.
# Root is a read-only squashfs; DATA is mounted separately for writes.
# Use the normal UART driver so that the clock is enabled before the console.
LABEL DEEPoS
    LINUX /KERNEL
    FDT /dtbs/rk3326-r36s-v20.dtb
    INITRD /ROOTDIR.CPIO
    APPEND root=PARTLABEL=DEEPOS_A rootfstype=squashfs ro rootwait rootdelay=3 console=ttyS2,1500000n8 console=tty0 loglevel=7 vt.global_cursor_default=0 consoleblank=0 nowatchdog mitigations=off zswap.enabled=1 psi=1 loop.max_loop=8 rdinit=/__deepos_mount_root__ init=/sbin/init panic=0
