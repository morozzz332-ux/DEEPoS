video_driver = "gl"
video_context_driver = "kms-egl"
video_smooth = "false"
audio_driver = "alsa"
# A bigger ALSA period keeps the audio thread alive when a core hogs the CPU.
audio_latency = "128"
# There is no udevd in DEEPoS, so RetroArch's udev input driver finds no
# keyboard (no ID_INPUT_* properties) and then falls back to linuxraw, which
# needs a controlling tty the launcher does not have: the video init fails with
# "Cannot initialize input driver". SDL2 reads evdev directly and works.
input_driver = "sdl2"
# The volume rocker (adc-keys) reaches SDL as scancodes 128/129/127 — the
# evdev keycodes 115/114/113 are translated by SDL, so the binding has to use
# the SDL numbers. This also works inside a game, where the launcher is blocked
# waiting for the emulator to exit and cannot draw its own overlay.
input_volume_up = "keycode 128"
input_volume_down = "keycode 129"
input_volume_mute = "keycode 127"
audio_volume = "-2.0"
menu_enable_widgets = "true"
input_joypad_driver = "udev"
joypad_autoconfig_dir = "/data/emus/autoconfig"
menu_driver = "rgui"
system_directory = "/storage/bios"
savefile_directory = "/storage/.config/retroarch/saves"
savestate_directory = "/storage/.config/retroarch/states"
config_save_on_exit = "false"
