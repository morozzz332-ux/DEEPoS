video_driver = "gl"
video_context_driver = "kms-egl"
video_smooth = "false"
audio_driver = "alsa"
# There is no udevd in DEEPoS, so RetroArch's udev input driver finds no
# keyboard (no ID_INPUT_* properties) and then falls back to linuxraw, which
# needs a controlling tty the launcher does not have: the video init fails with
# "Cannot initialize input driver". SDL2 reads evdev directly and works.
input_driver = "sdl2"
# The volume rocker (adc-keys) arrives as keycodes 115/114 and works inside a
# game too, where the launcher is blocked waiting for the emulator to exit.
# The OSD bar is the only feedback there, so it stays enabled.
input_volume_up = "keycode 115"
input_volume_down = "keycode 114"
input_volume_mute = "keycode 113"
audio_volume = "-2.0"
menu_enable_widgets = "true"
input_joypad_driver = "udev"
joypad_autoconfig_dir = "/data/emus/autoconfig"
menu_driver = "rgui"
system_directory = "/storage/bios"
savefile_directory = "/storage/.config/retroarch/saves"
savestate_directory = "/storage/.config/retroarch/states"
config_save_on_exit = "false"
